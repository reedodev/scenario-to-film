name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg (use the one on the runner, install only if missing)
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo timeout 300 apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1
      - run: pip install pillow numpy
      - run: node tests/run.mjs
        env:
          PYTHON: python